function renderRows(){const q=$('search').value.toLowerCase(),f=$('filter').value;let heads=[],rows=[];if(filled()){if(view==='instrumentos'||view==='revisoes'){heads=view==='instrumentos'?['Instrumento / sindicato','Tipo','Vigência','Análise','Situação','']:['CCT / sindicato','O que precisa de atenção','Versão','Situação',''];let list=docs.map((d,i)=>({d,i})).filter(({d})=>(view==='instrumentos'||!d.base)&&(d.id+d.name+d.clients.join(' ')).toLowerCase().includes(q)&&(view==='instrumentos'?(f==='all'||d.type===f):(f==='all'||(f==='pending')===(d.status==='Revisão pendente'))));if($('sort').value==='number')list.sort((a,b)=>a.d.id.localeCompare(b.d.id));else list.sort((a,b)=>b.d.date.localeCompare(a.d.date));rows=list.map(({d,i})=>`<tr><td><button class="name" data-doc="${i}">${d.id}</button><div class="secondary">${d.name}</div></td>${view==='instrumentos'?`<td>${d.type}</td><td>${d.vigencia}</td><td>${tag('Concluída','good')}</td>`:`<td>${d.status==='Revisão pendente'?'Reajuste salarial · 1 decisão':'Sem decisões pendentes'}</td><td>Versão demonstrativa 02</td>`}<td>${tag(d.status,d.status==='Revisão pendente'?'warn':d.status==='Revisado'?'good':'')}</td><td><div class="rowactions"><button data-doc="${i}">Abrir ficha</button>${view==='revisoes'&&d.status==='Revisão pendente'?`<button class="primary" data-review="${i}">Revisar</button>`:''}</div></td></tr>`)}else if(view==='publicacoes'){heads=['Empresa / documento','Disponibilizado em','Versão publicada','Situação',''];rows=publications.map((p,i)=>({p,i})).filter(({p})=>(p.client+docs[p.doc].id).toLowerCase().includes(q)&&(f==='all'||p.active===(f==='active'))).map(({p,i})=>`<tr><td><strong>${esc(p.client)}</strong><div class="secondary">${docs[p.doc].id} · ${docs[p.doc].name}</div></td><td>10/10/2026 · 14:20</td><td>${p.version}</td><td>${tag(p.active?'Ativa':'Revogada',p.active?'good':'')}</td><td><div class="rowactions"><button data-publication="${i}">Ver publicação</button></div></td></tr>`)}else{heads=['Data e hora','Usuário / empresa','Documento','Evento','IP',''];rows=[['11/10/2026 · 09:42','Marina Costa','Restaurante Jardins','Abertura','open'],['11/10/2026 · 09:45','Marina Costa','Restaurante Jardins','Ciência confirmada','science']].filter(r=>r.join(' ').toLowerCase().includes(q)&&(f==='all'||f===r[4])).map(r=>`<tr><td>${r[0]}</td><td><strong>${r[1]}</strong><div class="secondary">${r[2]}</div></td><td>DF000016/2026</td><td>${tag(r[3],r[4]==='science'?'good':'')}</td><td>192.0.2.24</td><td><button data-event="${r[4]}">Ver evento</button></td></tr>`)}}$('total').textContent=rows.length+' resultado(s) · '+$('office').value;$('content').innerHTML=rows.length?`<div class="scroll"><table><thead><tr>${heads.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="empty"><h2>${filled()?'Nenhum resultado encontrado':'Ainda não há documentos neste escritório'}</h2><p>${filled()?'Ajuste a busca ou os filtros para continuar.':'Os instrumentos aparecerão após a coleta e o relacionamento com os clientes.'}</p><button data-empty>${filled()?'Limpar filtros':'Como começar'}</button></div>`}
function openDoc(i,tab='resumo'){selected=i;detailTab=tab;const d=docs[i];$('detailTitle').textContent=d.id;$('detailSubtitle').textContent=d.name+' · '+d.type;$('stage').innerHTML=['Original','Análise','Revisão','Publicação'].map((t,k)=>`<span class="${k<2?'done':k===2?'current':''}">${k<2?'✓ ':''}${t}</span>`).join('<span aria-hidden="true" style="border:0;padding:0">›</span>');$('detailNav').innerHTML=[['resumo','Visão geral'],['original','Original'],['analise','Análise'],['consolidacao','Consolidação'],['aditivos','Aditivos'],['clientes','Clientes']].map(([key,t])=>`<button data-detail="${key}" class="${key===tab?'active':''}">${t}</button>`).join('');$('nextAction').textContent=d.base?'Gerenciar vínculo':d.status==='Revisão pendente'?'Revisar pendência':'Publicar versão revisada';renderDetail();if(!$('detail').open)$('detail').showModal()}
function renderDetail(){const d=docs[selected];$('detailNav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.detail===detailTab));let html='';if(detailTab==='resumo'){html=`<div class="document-top"><div><h3>${d.name}</h3><p>${d.clients.length} cliente(s) relacionado(s)</p></div>${tag(d.status,d.status==='Revisão pendente'?'warn':'good')}</div><div class="document-meta"><div><small>Vigência</small><b>${d.vigencia}</b></div><div><small>Identificado em</small><b>${d.date}</b></div><div><small>Análise por IA</small><b>Concluída · conferir conteúdo original</b></div><div><small>Consolidação</small><b>${d.base?'Aditivo de '+d.base:'Versão demonstrativa 02'}</b></div></div>${d.status==='Revisão pendente'?'<div class="progress-note"><div><h3>Reajuste salarial precisa de revisão</h3><p>Um aditivo altera a regra da CCT. Confira a evidência antes de disponibilizar a versão consolidada.</p></div></div>':'<div class="callout">'+(d.base?'O vínculo indica a CCT base. Aplicação das alterações depende da consolidação e revisão.':'Não há pendências nesta versão demonstrativa. A publicação ainda exige escolher o cliente e confirmar a versão.')+'</div>'}<details class="linkcard"><summary>Identificação técnica da versão</summary><p style="margin-top:12px">Versão: demonstrativa 02 · hash e trilha de execução serão apresentados com os dados reais.</p></details>`}else if(detailTab==='original'){html='<div class="detail-actions"><button data-demo="Download original simulado; nenhum arquivo foi baixado.">Baixar original</button></div><div class="pdf-preview"><div class="paper"><h3>CONVENÇÃO COLETIVA DE TRABALHO</h3><p>Registro '+d.id+'</p><hr><h3>CLÁUSULA TERCEIRA · REAJUSTE SALARIAL</h3><p>As condições desta página são fictícias e servem somente à avaliação visual do produto.</p><p>Na implementação, o original autorizado será disponibilizado para conferência. Esta composição não representa o texto de um instrumento real.</p></div></div>'}else if(detailTab==='consolidacao'){html=d.base?'<div class="callout">A consolidação é consultada na ficha da CCT base '+d.base+'.</div>':`<div class="document-top"><div><h3>Consolidação do escritório</h3><p>Versão demonstrativa 02 · regras e decisões da CCT</p></div><button data-demo="Consolidação simulada. Na aplicação, alterações podem invalidar a revisão anterior.">Atualizar consolidação</button></div>${d.status==='Revisão pendente'?'<div class="progress-note"><p>Uma decisão pendente impede relatórios finais e publicação desta versão.</p></div>':'<div class="callout">Versão revisada nesta demonstração. Confira o cliente antes de gerar o relatório.</div>'}<details class="linkcard"><summary>Consultar regras consolidadas</summary><p>Reajuste salarial · valores demonstrativos.</p><p>Auxílio-alimentação · condições do instrumento.</p><p>Na implementação, todos os campos atuais continuam disponíveis, com evidências e histórico.</p></details><div class="fields"><label class="field wide">Cliente do relatório<select>${d.clients.map(c=>'<option>'+esc(c)+'</option>').join('')}</select></label></div><div class="detail-actions"><button ${d.status==='Revisão pendente'?'disabled':''} data-demo="Download PDF demonstrativo. Nenhum relatório real foi gerado.">Baixar relatório PDF</button><button ${d.status==='Revisão pendente'?'disabled':''} data-demo="Download Markdown demonstrativo.">Baixar Markdown</button></div><details class="linkcard"><summary>Histórico de versões e decisões</summary><p>Versão 02 · aditivo relacionado e revisão atual.</p><p>Versão 01 · consolidação anterior preservada.</p></details>`;}else if(detailTab==='analise'){html='<div class="callout">Análise assistida por IA · confira as informações no documento original. Os valores abaixo são fictícios.</div><article class="sheetcard"><h3>Reajuste salarial</h3><p>Atualização de 5,2% a partir da data-base.</p><h3>Auxílio-alimentação</h3><p>Condições e valores definidos no instrumento coletivo.</p><details><summary>Ver evidências e demais campos</summary><p>Cláusulas e citações seriam exibidas por campo, preservando os dados completos da análise atual.</p></details></article>'}else if(detailTab==='aditivos'){const list=docs.filter(x=>x.base===d.id);html=`<div class="document-top"><div><h3>Vínculos com a CCT base</h3><p>Vínculos são privados deste escritório.</p></div><button data-link>Gerenciar vínculos</button></div>${d.base?'<article class="linkcard"><h3>CCT base</h3><p>'+d.base+'</p></article>':list.map(x=>'<article class="linkcard"><h3>'+x.id+'</h3><p>'+x.type+'</p>'+tag('Vinculado')+'</article>').join('')||'<div class="callout">Nenhum aditivo vinculado a esta CCT.</div>'}`}else{html='<div class="callout">Relacionamento não equivale a aplicabilidade confirmada nem libera a publicação automaticamente.</div>'+d.clients.map(c=>'<article class="linkcard"><div class="linkhead"><div><h3>'+c+'</h3><p>Enquadramento e aplicabilidade precisam ser conferidos na ficha da empresa.</p></div><button data-demo="Na implementação, abre os documentos deste cliente com o contexto preservado.">Ver aplicabilidade</button></div></article>').join('')}$('detailBody').innerHTML=html}
function action(kind,i=selected){pendingAction=kind;actionIndex=i;if($('detail').open)$('detail').close();$('actionSave').disabled=false;let body='',title='',sub='',save='Confirmar';if(kind==='review'){title='Revisar reajuste salarial';sub=docs[i].id+' · aditivo DF000526/2026 · versão demonstrativa 02';save='Registrar revisão';body='<div class="rule"><div class="rulehead"><strong>Reajuste salarial</strong>'+tag('Decisão pendente','warn')+'</div><div class="compare"><div><small>CCT · regra anterior</small><p>Reajuste de 4,5% a partir de maio de 2026.</p></div><div class="after"><small>Aditivo · trecho proposto</small><p>Reajuste de 5,2% a partir de setembro de 2026.</p></div></div><div class="evidence">Evidência demonstrativa · cláusula terceira. Valores fictícios para avaliação visual.</div></div><label class="field">Decisão<select id="decision"><option value="manter">Manter regra anterior</option><option value="aditivo">Usar trecho literal do aditivo</option><option value="manual">Informar regra revisada</option></select></label><label class="field" id="manualField" style="margin-top:16px" hidden>Texto da regra revisada<textarea id="manualText"></textarea></label><label class="field" style="margin-top:16px">Justificativa da revisão<textarea required minlength="8" placeholder="Explique a decisão após conferir a evidência."></textarea></label>'}else if(kind==='publish'){title='Publicar versão revisada';sub='Disponibilize uma versão para uma empresa. E-mail é uma etapa separada.';save='Publicar no portal';const ready=docs.map((d,j)=>({d,j})).filter(({d})=>!d.base&&d.status==='Revisado');body='<div class="fields"><label class="field wide">CCT revisada<select id="publishDoc">'+ready.map(({d,j})=>'<option value="'+j+'" '+(i===j?'selected':'')+'>'+d.id+' · '+d.name+'</option>').join('')+'</select></label><label class="field wide">Empresa<select id="publishClient"></select></label></div><div class="pub-summary"><span class="pill good">Sem pendências</span><div><strong>Versão demonstrativa 02</strong><p>Será disponibilizada somente para a empresa selecionada.</p></div></div><label class="checks"><input type="checkbox" required> Conferi a empresa e a versão que será disponibilizada.</label>';if(!ready.length){body='<div class="callout">Nenhuma CCT revisada disponível. Conclua a revisão antes de publicar.</div>';$('actionSave').disabled=true}}else if(kind==='link'){title='Gerenciar vínculo do aditivo';sub='Escolha a CCT base e registre o motivo da alteração.';save='Salvar vínculo';body='<div class="fields"><label class="field wide">Aditivo<select><option>DF000526/2026 · Sinpospetro DF</option></select></label><label class="field wide">CCT base<select><option>DF000525/2026 · Sinpospetro DF</option><option>DF000016/2026 · Sechosc</option><option>Sem vínculo</option></select></label><label class="field wide">Justificativa<textarea required minlength="8"></textarea></label></div>'}else if(kind==='publication'){const p=publications[i];title='Publicação · '+p.client;sub=docs[p.doc].id;save='Concluir';body='<div class="document-meta"><div><small>Situação</small><b>'+ (p.active?'Ativa':'Revogada')+'</b></div><div><small>Versão publicada</small><b>'+p.version+'</b></div></div><div class="callout">A publicação é uma versão específica. Novas análises não substituem automaticamente o documento já disponibilizado.</div><button type="button" data-publication-access>Consultar acessos</button> <button type="button" data-revoke="'+i+'" '+(!p.active?'disabled':'')+'>Revogar publicação</button>'}else if(kind==='revoke'){title='Revogar publicação';sub='O acesso a esta publicação será encerrado na demonstração.';save='Confirmar revogação';body='<div class="callout">'+esc(publications[i].client)+' · '+docs[publications[i].doc].id+'</div><label class="checks"><input type="checkbox" required>Confirmo a revogação desta publicação.</label>'}else{title='Detalhe do evento';sub='Registro de acesso demonstrativo';save='Fechar';body='<div class="document-meta"><div><small>Usuário</small><b>Marina Costa</b></div><div><small>Empresa</small><b>Restaurante Jardins</b></div><div><small>Documento</small><b>DF000016/2026</b></div><div><small>IP</small><b>192.0.2.24</b></div><div><small>Resultado</small><b>Permitido</b></div><div><small>Evento</small><b>'+ (kind==='science'?'Ciência confirmada':'Abertura')+'</b></div></div>'}$('actionTitle').textContent=title;$('actionSubtitle').textContent=sub;$('actionSave').textContent=save;$('actionBody').innerHTML=body;$('actionForm').reset();$('action').showModal();if($('decision'))$('decision').onchange=()=>{$('manualField').hidden=$('decision').value!=='manual';$('manualText').required=$('decision').value==='manual'};if($('publishDoc')){const update=()=>{$('publishClient').innerHTML=docs[Number($('publishDoc').value)].clients.map(c=>'<option>'+esc(c)+'</option>').join('')};$('publishDoc').onchange=update;update()}}
$('actionForm').onsubmit=e=>{e.preventDefault();if(pendingAction==='review'){docs[actionIndex].status='Revisado';notify('Revisão registrada somente nesta prévia.')}else if(pendingAction==='publish'){publications.push({doc:Number($('publishDoc').value),client:$('publishClient').value,active:true,version:'demo-v02',science:false});notify('Publicação simulada. Nenhum documento real foi disponibilizado.')}else if(pendingAction==='revoke'){publications[actionIndex].active=false;notify('Publicação revogada somente nesta prévia.')}else notify('Prévia concluída. Nenhuma alteração no sistema.');$('action').close();render()};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view)switchView(b.dataset.view);if(b.dataset.doc!==undefined)openDoc(Number(b.dataset.doc));if(b.dataset.detail){detailTab=b.dataset.detail;renderDetail()}if(b.dataset.close)$(b.dataset.close).close();if(b.dataset.review!==undefined)action('review',Number(b.dataset.review));if(b.dataset.publication!==undefined)action('publication',Number(b.dataset.publication));if(b.hasAttribute('data-link'))action('link');if(b.dataset.revoke!==undefined){$('action').close();action('revoke',Number(b.dataset.revoke))}if(b.hasAttribute('data-publication-access')){$('action').close();switchView('acessos')}if(b.dataset.event)action(b.dataset.event);if(b.dataset.demo)notify(b.dataset.demo);if(b.dataset.out)notify('Esta prévia detalha Documentos. '+b.dataset.out+' fica fora desta proposta.');if(b.hasAttribute('data-empty')){if(filled()){$('search').value='';$('filter').value='all';renderRows()}else notify('Configure clientes e sindicatos em Cadastros e solicite a coleta em Monitoramento.')}});
$('primary').onclick=()=>{if(!filled()){notify('Este escritório ainda não tem documentos. Comece pelos cadastros e monitoramento.');return}if(view==='instrumentos')notify('Lista demonstrativa atualizada. Nenhuma coleta externa foi executada.');else if(view==='revisoes')switchView('instrumentos');else if(view==='publicacoes')action('publish',1);else{const csv='data,usuario,empresa,documento,evento,ip\n2026-10-11,Marina Costa,Restaurante Jardins,DF000016/2026,Abertura,192.0.2.24';const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='auditoria-demonstrativa.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('CSV demonstrativo exportado.')}};$('nextAction').onclick=()=>action(docs[selected].base?'link':docs[selected].status==='Revisão pendente'?'review':'publish');$('search').oninput=renderRows;$('filter').onchange=renderRows;$('sort').onchange=renderRows;$('theme').onclick=()=>document.body.classList.toggle('light');$('office').onchange=()=>{for(const id of ['detail','action'])if($(id).open)$(id).close();render();notify('Escritório alterado para '+$('office').value)};render();
</script></body></html>
