const $=id=>document.getElementById(id),paths={building:'M3 21h18M5 21V5l7-3 7 3v16M9 8h1m4 0h1M9 12h1m4 0h1M10 21v-5h4v5',search:'m21 21-5-5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',plus:'M12 5v14M5 12h14',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M15 3a4 4 0 0 1 0 8M22 21v-2a4 4 0 0 0-3-3.9M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0',check:'m5 12 4 4L19 6',mail:'M3 5h18v14H3zM3 5l9 8 9-8',union:'M12 3 2 8l10 5 10-5-10-5M4 12v5l8 4 8-4v-5',info:'M12 11v6M12 7h.01M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',moon:'M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11',close:'m6 6 12 12M6 18 18 6',chevron:'m8 10 4 4 4-4',doc:'M14 2H6v20h12V6l-4-4M14 2v5h5M9 12h6M9 16h6'};

const field=(label,name,value='',wide=false,type='text')=>`<label class="field ${wide?'wide':''}">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${name==='name'||name==='email'?'required':''}></label>`,choice=(label,name,options,value)=>`<label class="field">${label}<select name="${name}">${options.map(([v,t])=>`<option value="${v}" ${String(value)===v?'selected':''}>${t}</option>`).join('')}</select></label>`;
function showTab(t){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));document.querySelectorAll('[data-pane]').forEach(p=>p.hidden=p.dataset.pane!==t)}
function openEditor(i=-1){editing=i;const r=i>=0?db[view][i]:{},client=view==='clientes',contact=view==='contatos';$('modalTitle').textContent=i<0?cfg[view].create:'Editar '+(client?'cliente':contact?'contato':'consulta');$('modalDescription').textContent=client?'Dados da empresa e vínculos organizados por assunto.':contact?'Uma pessoa pode estar vinculada a várias empresas.':'Configure uma consulta privada a partir do catálogo compartilhado.';const tabs=client?[['dados','Dados da empresa'],['contatos','Contatos e envio'],['sindicatos','Sindicatos']]:contact?[['dados','Dados do contato']]:[['dados','Sindicato e consulta'],['filtros','Filtros de busca']];$('modalnav').innerHTML=tabs.map(([id,t])=>`<button type="button" data-tab="${id}">${t}</button>`).join('');let html='';if(client){html=`<section data-pane="dados"><div class="fields"><label class="field wide">CNPJ<div class="inline"><input name="cnpj" value="${esc(r.cnpj)}" placeholder="00.000.000/0000-00" required><button type="button" id="consult">Consultar CNPJ</button></div><small>Consulte os dados ou preencha manualmente.</small></label><div class="callout wide" id="cnpjResult" hidden>Dados demonstrativos · Posto Monumental · Brasília / DF <button type="button" id="acceptCnpj">Usar dados</button></div>${field('Razão social','name',r.name,true)}${field('Nome fantasia','fantasia',r.fantasia,true)}${field('Município','city',r.city)}${field('UF','uf',r.uf||'DF')}${choice('Situação','active',[['true','Ativo'],['false','Inativo']],r.active??true)}</div></section><section data-pane="contatos" hidden><div class="fields" style="margin-bottom:22px">${choice('Modo de envio','mode',[['revisao','Revisar antes de enviar'],['automatico','Automático conforme regras']],r.mode||'revisao')}</div><h3>Contatos da empresa</h3><p>Marque quem faz parte deste cliente e ajuste suas preferências.</p>${db.contatos.map((c,j)=>`<article class="linkcard"><div class="linkhead"><div><h3>${esc(c.name)}</h3><p>${esc(c.email)} · ${esc(c.cargo)}</p></div><label><input type="checkbox" name="contact" value="${j}" ${r.contacts?.includes(j)?'checked':''}>Vincular</label></div><details><summary>Preferências neste cliente</summary><div class="fields">${field('Função neste cliente','funcao'+j,c.cargo)}${choice('Recebimento de e-mail','receber'+j,[['true','Receber documentos'],['false','Não receber e-mail']],'true')}</div><p style="font-size:12px;margin-top:15px">Tipos de documento · nenhum marcado significa todos</p><div class="checks">${['Convenção Coletiva','Acordo Coletivo','Termo Aditivo de Convenção Coletiva','Termo Aditivo de Acordo Coletivo'].map(t=>`<label><input type="checkbox" name="contactType${j}" value="${t}">${t}</label>`).join('')}</div></details></article>`).join('')}</section><section data-pane="sindicatos" hidden><h3>Enquadramento sindical</h3><p>Vincule sindicatos, defina o principal e confirme o enquadramento.</p>${db.sindicatos.map((s,j)=>`<article class="linkcard"><div class="linkhead"><div><h3>${esc(s.name)}</h3><p>${esc(s.cnpj)} · ${esc(s.uf)}</p></div><label><input type="checkbox" name="union" value="${j}" ${r.unions?.includes(j)?'checked':''}>Vincular</label></div><details ${r.unions?.includes(j)?'open':''}><summary>Enquadramento neste cliente</summary><div class="fields">${field('Categoria','category'+j,s.category)}${field('Município','municipio'+j,r.city||'Brasília')}${field('UF','uf'+j,s.uf)}</div><div class="checks"><label><input type="radio" name="principal" value="${j}" ${r.unions?.[0]===j?'checked':''}>Sindicato principal</label><label><input type="checkbox" name="confirmed${j}" ${r.unions?.includes(j)?'checked':''}>Enquadramento confirmado</label></div></details></article>`).join('')}<p style="font-size:12px">Novos sindicatos são adicionados em Cadastros → Sindicatos.</p></section>`}else if(contact){html=`<section data-pane="dados"><div class="fields">${field('Nome completo','name',r.name,true)}${field('E-mail','email',r.email,true,'email')}${field('Telefone','phone',r.phone,false,'tel')}${field('Cargo','cargo',r.cargo)}${choice('Situação','active',[['true','Ativo'],['false','Inativo']],r.active??true)}</div><div class="callout" style="margin-top:22px">Vínculos e preferências de envio são definidos na ficha de cada cliente. O cadastro da pessoa é compartilhado somente dentro deste escritório.</div></section>`}else{html=`<section data-pane="dados"><div class="callout">O catálogo identifica o sindicato. Esta configuração determina o que o seu escritório acompanha.</div><div class="fields"><label class="field wide">Sindicato do catálogo<select name="name">${db.sindicatos.map(s=>`<option ${r.name===s.name?'selected':''}>${esc(s.name)}</option>`).join('')}</select><small>Não encontrou? O cadastro no catálogo é feito pela administração da plataforma.</small></label>${field('Nome da consulta privada','query',r.query,true)}${choice('Situação','active',[['true','Ativo'],['false','Inativo']],r.active??true)}</div></section><section data-pane="filtros" hidden><div class="fields">${field('Filtro de CNPJ','cnpj',r.cnpj)}${field('Categoria','category',r.category)}${field('UF','uf',r.uf)}${field('Palavra no título','title',r.title)}${field('Vigência','vigencia',r.vigencia||'Vigentes',true)}</div><h3 style="margin-top:24px">Tipos de instrumento</h3><p style="font-size:12px">Nenhum marcado significa todos os tipos nesta proposta.</p><div class="checks">${['Convenção Coletiva','Acordo Coletivo','Termo Aditivo de Convenção Coletiva','Termo Aditivo de Acordo Coletivo'].map(t=>`<label><input type="checkbox" name="type" value="${t}" ${r.types?.includes(t)?'checked':''}>${t}</label>`).join('')}</div></section>`}$('formcontent').innerHTML=html;showTab('dados');$('editor').showModal();if($('consult'))$('consult').onclick=()=>{$('cnpjResult').hidden=false;notify('Consulta simulada. Nenhum serviço externo foi acessado.')};if($('acceptCnpj'))$('acceptCnpj').onclick=()=>{const f=$('editForm');f.elements.namedItem('name').value='Goes Combustíveis, Lubrificantes e GLP Ltda';f.elements.namedItem('fantasia').value='Posto Monumental';f.elements.namedItem('city').value='Brasília';$('cnpjResult').hidden=true;notify('Dados da prévia aplicados ao formulário.')};}
function openFicha(i){fichaIndex=i;const c=db.clientes[i];$('fichaTitle').textContent=c.fantasia||c.name;$('fichaSubtitle').textContent=c.name+' · '+c.cnpj;$('fichaContent').innerHTML=`<div class="sheetgrid"><article class="sheetcard"><h3>Dados e envio</h3><p>${esc(c.city)} / ${esc(c.uf)}</p>${pill(c.active?'Ativo':'Inativo',c.active?'good':'')}<p>Modo de envio: ${c.mode==='automatico'?'automático conforme regras':'revisar antes de enviar'}</p></article><article class="sheetcard"><h3>Documentos da empresa</h3><p>Consulte instrumentos relacionados, revisões e documentos disponibilizados.</p><button type="button" id="docsPreview">${icon('doc')} Ver documentos</button></article><article class="sheetcard"><h3>Contatos vinculados</h3>${c.contacts.map(j=>`<p><strong>${esc(db.contatos[j].name)}</strong><br>${esc(db.contatos[j].email)}</p>`).join('')||'<p>Nenhum contato vinculado.</p>'}</article><article class="sheetcard"><h3>Sindicatos</h3>${c.unions.map((j,k)=>`<p><strong>${esc(db.sindicatos[j].name)}</strong></p>${pill(k===0?'Principal':'Complementar')}`).join('')||'<p>Nenhum sindicato vinculado.</p>'}</article></div>`;$('ficha').showModal();$('docsPreview').onclick=()=>notify('Documentos será integrado após aprovação. Esta prévia detalha Cadastros.')}
$('editForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),base=editing>=0?db[view][editing]:{},record={...base};for(const [key,value]of f)if(!['contact','union','type','principal'].includes(key))record[key]=value;record.active=f.get('active')==='true';if(view==='clientes'){record.contacts=f.getAll('contact').map(Number);record.unions=f.getAll('union').map(Number);const principal=Number(f.get('principal'));if(f.has('principal')&&record.unions.includes(principal))record.unions.sort((a,b)=>(a===principal?-1:b===principal?1:0))}if(view==='sindicatos')record.types=f.getAll('type');if($('office').value==='Gconta')notify('Salvar simulado. O escritório vazio permanece sem dados nesta prévia.');else{if(editing<0)db[view].push(record);else db[view][editing]=record;notify('Cadastro atualizado somente nesta prévia. Recarregar restaura os exemplos.')} $('editor').close();render()};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;$('search').value='';$('status').value='all';render()}if(b.dataset.close)$(b.dataset.close).close();if(b.dataset.tab)showTab(b.dataset.tab);if(b.dataset.edit!==undefined)openEditor(Number(b.dataset.edit));if(b.dataset.ficha!==undefined)openFicha(Number(b.dataset.ficha));if(b.hasAttribute('data-empty')){if(dataset().length){$('search').value='';$('status').value='all';renderTable()}else openEditor()}if(b.dataset.placeholder)notify('Esta proposta detalha Cadastros. '+b.dataset.placeholder+' permanece fora desta prévia.')});$('create').onclick=()=>openEditor();$('editFromFicha').onclick=()=>{$('ficha').close();openEditor(fichaIndex)};$('search').oninput=renderTable;$('status').onchange=renderTable;$('sort').onchange=renderTable;$('office').onchange=()=>{$('search').value='';$('status').value='all';render();notify('Escritório alterado para '+$('office').value)};$('theme').onclick=()=>document.body.classList.toggle('light');$('cadastrosNav').onclick=()=>{$('subnav').hidden=false;notify('Escolha Clientes, Contatos ou Sindicatos no submenu.')};for(const [id,ic]of [['logo','union'],['officeIcon','building'],['theme','moon'],['chevron','chevron'],['searchIcon','search'],['infoIcon','info']])$(id).innerHTML=icon(ic);document.querySelectorAll('button.icon[data-close]').forEach(b=>b.innerHTML=icon('close'));render();
// A demonstração preserva preferências enquanto a página estiver aberta.
const originalOpenEditor=openEditor;
openEditor=function(i=-1){originalOpenEditor(i);if(i<0)return;const saved=db[view][i];for(const control of $('editForm').elements){if(!control.name||['contact','union','type','principal'].includes(control.name)||!(control.name in saved))continue;const value=saved[control.name];if(control.type==='checkbox')control.checked=Array.isArray(value)?value.includes(control.value):value==='on';else control.value=value;}};
$('editForm').addEventListener('formdata',event=>{for(const control of $('editForm').elements){if(control.type!=='checkbox'||!control.name||['contact','union','type'].includes(control.name))continue;const values=[...$('editForm').elements].filter(c=>c.name===control.name&&c.checked).map(c=>c.value);event.formData.delete(control.name);event.formData.set(control.name,control.name.startsWith('contactType')?JSON.stringify(values):(control.checked?'on':''));}});
const reopenEditor=openEditor;openEditor=function(i=-1){reopenEditor(i);if(i<0)return;const saved=db[view][i];for(const control of $('editForm').elements)if(control.name?.startsWith('contactType')&&saved[control.name]){try{control.checked=JSON.parse(saved[control.name]).includes(control.value);}catch{control.checked=false;}}};
$('editForm').addEventListener('invalid',event=>{const pane=event.target.closest('[data-pane]');if(pane)showTab(pane.dataset.pane);},true);
</script></body></html>
