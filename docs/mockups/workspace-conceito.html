<script>
const paths={grid:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',doc:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M8 13h8 M8 17h5',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M22 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75',pulse:'M3 12h4l3-8 4 16 3-8h4',send:'m22 2-7 20-4-9-9-4 20-7z M22 2 11 13',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2',building:'M4 22V3h12v19 M16 10h4v12 M8 7h4 M8 11h4 M8 15h4 M8 22v-3h4v3 M2 22h20',moon:'M21 13a9 9 0 1 1-10-10 7 7 0 0 0 10 10',bell:'M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9 M10 21h4',arrow:'M5 12h14 M13 6l6 6-6 6',check:'m5 12 4 4L19 6',plus:'M12 5v14 M5 12h14',search:'M21 21l-5-5 M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14',clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18 M12 7v5l3 2',close:'M6 6l12 12 M6 18 18 6',download:'M12 3v12 M7 10l5 5 5-5 M4 17v4h16v-4',spark:'m12 3 3 6 6 3-6 3-3 6-3-6-6-3 6-3z'};

let current='overview',selected=0,recordTab='summary',query='',filter='all';const $=id=>document.getElementById(id);const populated=()=>$('office').value==='gescon';const tag=(text,kind='')=>`<span class="tag ${kind}"><span class="dot"></span>${text}</span>`;const btn=(text,action,kind='',i='')=>`<button class="${kind}" data-action="${action}">${i?icon(i):''}${text}</button>`;const navs=[['overview','Visão geral','grid'],['records','Registros','doc'],['clients','Clientes','users'],['monitor','Monitoramento','pulse'],['deliveries','Envios','send'],['settings','Escritório','settings']];

izonte</p><p>Hoje, 09:42</p></div></div><div class="activity"><span class="timeline" style="background:var(--accent)"></span><div><h3>Nova análise concluída</h3><p>DF000016/2026 · Sechosc</p><p>Hoje, 08:30</p></div></div><div class="activity"><span class="timeline"></span><div><h3>Envio entregue</h3><p>5 clientes receberam a atualização</p><p>Ontem, 16:18</p></div></div>`:'<p>As novidades do seu escritório aparecerão aqui.</p>'}</article><article class="card span12"><div class="overview-strip"><span class="icon-box">${icon('pulse')}</span><div style="flex:1"><strong>${filled?'Seu monitoramento está funcionando':'Configure seu primeiro monitoramento'}</strong><p>${filled?'2 sindicatos ativos · Última verificação às 08:15 · Próxima às 14:15':'Escolha os sindicatos e acompanhe as atualizações que interessam aos seus clientes.'}</p></div>${btn(filled?'Gerenciar':'Configurar','nav:monitor','link','arrow')}</div></article></div>`}
if(current==='records'){html=heading('Registros','Encontre o documento. Entenda a mudança. Decida o próximo passo.');if(!filled)html+=empty('Nenhum documento por aqui','Configure o monitoramento para começar a receber novos registros.',btn('Configurar monitoramento','nav:monitor','primary','plus'));else{const r=records[selected];html+=`<div class="toolbar"><label class="search">${icon('search')}<input id="recordSearch" aria-label="Buscar registros" placeholder="Buscar por registro ou sindicato" value="${query}"></label><select id="statusFilter" class="field" aria-label="Filtrar registros por situação"><option value="all">Todas as situações</option><option value="review" ${filter==='review'?'selected':''}>Aguardando revisão</option><option value="published" ${filter==='published'?'selected':''}>Disponibilizados</option></select></div><div class="record-layout"><div class="card record-list" id="recordResults">${recordItems()}</div><article class="card"><div class="detail-heading"><div><div class="eyebrow" style="margin-bottom:8px">${r.type}</div><h2>${r.id}</h2><p style="margin-top:8px">${r.name}</p></div>${tag(r.status,selected===0?'amber':'')}</div><div class="detail-actions">${btn(selected===0?'Revisar e disponibilizar':'Ver disponibilização',selected===0?'review':'publication','primary',selected===0?'check':'users')}${btn('Documento original','document','','download')}</div><div class="tabs" role="tablist">${[['summary','Visão geral'],['analysis','Análise'],['history','Histórico']].map(([id,label])=>`<button role="tab" aria-selected="${recordTab===id}" class="${recordTab===id?'active':''}" data-action="tab:${id}">${label}</button>`).join('')}</div>${recordTab==='summary'?`<div class="info"><div><small>Vigência</small><strong>${r.period}</strong></div><div><small>Clientes relacionados</small><strong>${r.clients} clientes do Gescon</strong></div><div><small>Sindicato acompanhado</small><strong>${selected===2?'Sinpospetro DF':'Sechosc'}</strong></div><div><small>Detectado em</small><strong>Hoje, às 08:15</strong></div></div><div class="callout"><span style="color:var(--accent)">${icon('spark')}</span><div><h3>O que merece sua atenção</h3><p>Reajuste salarial de 5,2%, atualização do auxílio-alimentação e novos prazos para compensação de jornada.</p><p style="margin-top:8px">Confira o documento original antes de disponibilizar aos clientes.</p></div></div>`:recordTab==='analysis'?'<h3>Principais mudanças</h3><div class="row"><div><strong>Reajuste salarial · 5,2%</strong><p>Aplicação a partir da data-base. Confira as categorias abrangidas.</p></div></div><div class="row"><div><strong>Auxílio-alimentação</strong><p>Atualização do valor e das condições de concessão.</p></div></div><p style="font-size:12px;margin-top:20px">Análise demonstrativa. A conferência do documento original faz parte da revisão.</p>':'<div class="activity"><span class="timeline"></span><div><strong>Análise concluída</strong><p>Hoje, 08:30</p></div></div><div class="activity"><span class="timeline"></span><div><strong>Documento identificado no Mediador</strong><p>Hoje, 08:15</p></div></div>'}</article></div>`}}
if(current==='clients'){html=heading('Clientes','Relacionamentos organizados. Informação chegando a quem precisa.',btn('Novo cliente','new-client','primary','plus'));if(!filled)html+=empty('Seu primeiro cliente começa aqui','Cadastre uma empresa para organizar documentos, contatos e acessos.',btn('Cadastrar cliente','new-client','primary','plus'));else html+=`<div class="toolbar"><label class="search">${icon('search')}<input id="clientSearch" placeholder="Buscar empresa ou CNPJ" aria-label="Buscar clientes"></label></div><article class="card"><div class="card-head"><h2>Empresas do escritório</h2><span class="muted" style="font-size:13px">3 empresas nesta demonstração</span></div><div class="table-scroll"><table><thead><tr><th>Empresa</th><th>Sindicato</th><th>Acesso aos documentos</th><th></th></tr></thead><tbody id="clientRows">${clientRows()}</tbody></table></div></article>`}
if(current==='monitor'){html=heading('Monitoramento','O Mediador acompanha as novidades. Você acompanha as decisões.',btn('Adicionar sindicato','new-monitor','primary','plus'));html+=`<div class="grid">${filled?['Sechosc','Sinpospetro DF'].map((name,i)=>`<article class="card span6" style="grid-column:span 6"><div class="card-head"><span class="icon-box">${icon('pulse')}</span>${tag('Ativo')}</div><h2>${name}</h2><p style="margin-top:6px">Distrito Federal · ${i?'Postos de combustíveis':'Comércio e serviços'}</p><div class="status-line"><p style="font-size:13px">A cada 6 horas</p>${btn('Ajustar','monitor:'+name,'link','settings')}</div></article>`).join(''):empty('Acompanhe o que importa','Adicione os sindicatos relevantes para seus clientes.',btn('Adicionar sindicato','new-monitor','primary','plus'))}</div>`}
if(current==='deliveries'){html=heading('Envios','Saiba o que chegou e quem já abriu.');html+=filled?`<div class="grid"><article class="card span4"><p>Entregues</p><div class="number">18</div>${tag('Últimos 7 dias')}</article><article class="card span4"><p>Documentos acessados</p><div class="number">16</div><p>Por usuários identificados</p></article><article class="card span4"><p>Aguardando abertura</p><div class="number">2</div><p>Clientes que ainda não consultaram</p></article><article class="card span12"><div class="card-head"><h2>Últimas disponibilizações</h2></div>${records.slice(1).map((r,i)=>`<div class="row"><span class="doc-icon">${icon('send')}</span><div class="grow"><strong>${r.id}</strong><p>${r.clients} clientes · Disponibilizado ontem</p></div>${tag('Entregue')}${btn('Ver acessos','accesses','link','arrow')}</div>`).join('')}</article></div>`:empty('Seus envios aparecerão aqui','Depois da revisão, disponibilize documentos aos clientes com um passo.')}
if(current==='settings'){html=heading('Seu escritório','Um lugar para a equipe, os dados do escritório e as preferências.');html+=`<div class="grid"><article class="card span4"><div class="card-head"><span class="icon-box">${icon('building')}</span>${tag('Ativo')}</div><h2>${filled?'Gescon':'Gconta'}</h2><p style="margin:10px 0 25px">Escritório de contabilidade</p>${btn('Editar dados','office-edit','link','arrow')}</article><article class="card span4"><div class="card-head"><span class="icon-box">${icon('users')}</span></div><h2>Equipe e acessos</h2><p style="margin:10px 0 25px">Convide pessoas e defina o que podem fazer.</p>${btn('Gerenciar equipe','team','link','arrow')}</article><article class="card span4"><div class="card-head"><span class="icon-box">${icon('bell')}</span></div><h2>Preferências de envio</h2><p style="margin:10px 0 25px">Organize os canais e as notificações.</p>${btn('Ajustar preferências','preferences','link','arrow')}</article></div>`} $('page').innerHTML=html;wireSearch()}
function recordItems(){const q=query.toLowerCase();return records.map((r,i)=>({r,i})).filter(({r,i})=>(r.id+' '+r.name).toLowerCase().includes(q)&&(filter==='all'||filter==='review'&&i===0||filter==='published'&&i>0)).map(({r,i})=>`<button class="record-item ${selected===i?'active':''}" data-action="record:${i}"><strong>${r.id}</strong><p>${r.name}</p>${tag(r.status,i===0?'amber':'')}</button>`).join('')||'<p style="padding:20px">Nenhum registro encontrado.</p>'}
const clients=[['Posto Horizonte','12.345.678/0001-90','Sinpospetro DF','Acessado'],['Restaurante Jardins','98.765.432/0001-10','Sechosc','Acessado'],['Café Aurora','45.678.901/0001-23','Sechosc','Aguardando abertura']];function clientRows(q=''){return clients.filter(c=>c.join(' ').toLowerCase().includes(q.toLowerCase())).map(c=>`<tr><td><strong>${c[0]}</strong><p>${c[1]}</p></td><td>${c[2]}</td><td>${tag(c[3],c[3]==='Acessado'?'':'amber')}</td><td>${btn('Ver cliente','client:'+c[0],'link','arrow')}</td></tr>`).join('')||'<tr><td colspan="4">Nenhum cliente encontrado.</td></tr>'}
function wireSearch(){if($('recordSearch'))$('recordSearch').oninput=e=>{query=e.target.value;$('recordResults').innerHTML=recordItems()};if($('statusFilter'))$('statusFilter').onchange=e=>{filter=e.target.value;$('recordResults').innerHTML=recordItems()};if($('clientSearch'))$('clientSearch').oninput=e=>$('clientRows').innerHTML=clientRows(e.target.value)}
function notify(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}
function modal(title,description,body,save='Salvar alterações'){ $('modalBody').innerHTML=`<div class="modal-head"><h2 id="modalTitle">${title}</h2><button class="icon" data-action="close" aria-label="Fechar modal">${icon('close')}</button></div><p>${description}</p><form id="modalForm"><div class="form-grid">${body}</div><div class="modal-footer">${btn('Cancelar','close')}<button class="primary" type="submit">${save}</button></div></form>`;$('modal').showModal();$('modalForm').onsubmit=e=>{e.preventDefault();$('modal').close();notify('Prévia concluída. Os dados deste protótipo não são salvos.')};$('modalForm').querySelectorAll('button[data-action]').forEach(b=>b.type='button')}
const field=(label,value='',type='text')=>`<label>${label}<input type="${type}" value="${value}" ${label==='Nome da empresa'?'required':''}></label>`;
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const [a,...rest]=el.dataset.action.split(':');const value=rest.join(':');if(a==='nav'){current=value;query='';filter='all';render()}else if(a==='record'){current='records';selected=Number(value);recordTab='summary';render()}else if(a==='tab'){recordTab=value;render()}else if(a==='close')$('modal').close();else if(a==='new-client')modal('Novo cliente','Organize a empresa e o contato responsável pelo acesso.',field('Nome da empresa')+field('CNPJ')+field('E-mail do responsável','','email'),'Cadastrar cliente');else if(a==='client')modal(value,'Dados da empresa e pessoas autorizadas.',field('Nome da empresa',value)+field('Responsável','Marina Costa')+field('E-mail','marina@example.com','email'));else if(a==='review')modal('Revisar e disponibilizar',`${records[selected].id} · Confira antes de enviar.`,`<div class="callout" style="margin:0"><div><strong>${records[selected].clients} clientes relacionados</strong><p>Os clientes receberão acesso ao documento e à análise revisada.</p></div></div><label style="display:flex;gap:10px;align-items:center"><input style="width:auto;margin:0" type="checkbox" required>Conferi o documento original e a análise.</label>`,'Disponibilizar documento');else if(a==='new-monitor'||a==='monitor')modal(a==='new-monitor'?'Adicionar monitoramento':value,'Escolha o sindicato e a frequência de acompanhamento.',field('Sindicato',value)+`<label>Frequência<select class="field" style="margin-top:6px"><option>A cada 6 horas</option><option>Uma vez por dia</option></select></label>`);else if(a==='team')modal('Equipe e acessos','Gerencie quem trabalha neste escritório.',`<div class="row"><button class="avatar" type="button">DR</button><div><strong>Diogo</strong><p>Administrador do escritório</p></div></div>`+field('Convidar por e-mail','','email'),'Enviar convite');else if(a==='office-edit')modal('Dados do escritório','Informações usadas nos cadastros e nas comunicações.',field('Nome',$('office').selectedOptions[0].text)+field('E-mail de contato','','email')+field('Telefone'));else if(a==='preferences')modal('Preferências de envio','Escolha como sua equipe recebe as novidades.','<label><input type="checkbox" checked style="width:auto"> Receber resumo diário por e-mail</label><label><input type="checkbox" checked style="width:auto"> Avisar quando um documento precisar de revisão</label>');else if(a==='accesses')modal('Acessos ao documento','Acompanhe a consulta realizada por cada usuário.','<div class="row"><div><strong>Marina Costa · Posto Horizonte</strong><p>Hoje, 09:42 · Documento original</p><p>IP: 192.0.2.24 · Dado demonstrativo</p></div></div>','Concluir');else if(a==='document')modal('Documento original',records[selected].id,'<div class="empty" style="padding:24px"><span class="doc-icon" style="display:inline-flex">'+icon('doc')+'</span><h3 style="margin:15px 0">Prévia do documento</h3><p>Na aplicação, este espaço abrirá o documento para conferência.</p></div>','Concluir');else if(a==='publication')modal('Disponibilização','Documento compartilhado com os clientes relacionados.','<div class="row">'+tag('Disponibilizado')+'<p>'+records[selected].clients+' clientes com acesso</p></div>','Concluir');else if(a==='verify')notify('Verificação simulada concluída. Nenhuma consulta externa foi executada.')});
$('office').onchange=()=>{selected=0;query='';filter='all';render();notify('Escritório alterado para '+$('office').selectedOptions[0].text)};$('theme').innerHTML=icon('moon');$('officeIcon').innerHTML=icon('building');$('notifications').innerHTML=icon('bell');$('theme').onclick=()=>document.body.classList.toggle('light');$('notifications').onclick=()=>modal('Notificações','As novidades que precisam da sua atenção.',populated()?'<div class="row"><div><strong>1 documento aguardando revisão</strong><p>O novo acordo do Sechosc está pronto para conferir.</p></div></div>':'<p>Nenhuma notificação neste escritório.</p>','Concluir');$('profile').onclick=()=>modal('Minha conta','Seus dados pessoais, separados da gestão do escritório.',field('Nome','Diogo')+field('E-mail','diogo@example.com','email'));$('modal').addEventListener('click',e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('modal').close()}});render();
</script></body></html>
